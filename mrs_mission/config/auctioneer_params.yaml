# params for auctioneer node, (which also doubles as the bidder node for robot 1, 'bidder_1')
auctioneer_node:  
  ros__parameters:
    # tasks
    n_tasks: 10
    T1: [1.0, 4.0, 1.0, 5.0]
    T2: [3.0, 3.0, 1.0, 5.0]
    T3: [4.0, 4.5, 1.0, 5.0]
    T4: [0.5, 2.5, 1.0, 5.0]
    T5: [4.5, 1.0, 1.0, 5.0]
    T6: [1.5, 1.0, 1.0, 5.0]
    T7: [2.0, 3.5, 2.0, 15.0]
    T8: [4.0, 2.5, 2.0, 15.0]
    T9: [2.5, 2.0, 3.0, 20.0]
    T10: [3.0, 0.5, 1.0, 5.0]

    # task heirarchy --> TF >> TL >> TH
    # TF: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6']  # free tasks
    TF: [1, 2, 3, 4, 5, 6]
    # TL: ['T7', 'T8']  # second layer
    TL: [7, 8]
    # TH: ['T9', 'T10']  # hidden layer
    TH: [9, 10]

    # task precedence constraints 
    p_1: [7, 1, 2]
    p_2: [8, 3, 5]
    p_3: [9, 7, 8]
    p_4: [10, 6, 8]

    # Assigning the shape of MR tasks
    T7_shape: 'Lv'
    T8_shape: 'Lh'
    T9_shape: 'T'

